name: Python application
on:
  push:
    branches:
      - "**"
      - "!main"
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 5
      matrix:
        version: [1]

    steps:
      - name: Default directory
        run: echo "CurrentDirectory=$(pwd)" >> $GITHUB_ENV

      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v3
        with:
          python-version: "3.10"

      - name: Set up packages
        uses: nill2/gha/install-packages@main

      - name: Run unit tests
        run: pytest './tests/test_unit.py'

      - name: Run linting (flake8 + pylint)
        run: |
          flake8 app tests --max-line-length=120
          pylint --rcfile=.pylintrc app tests || true
