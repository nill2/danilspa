repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        description: Remove trailing whitespace.
      - id: end-of-file-fixer
        description: Ensure a single newline at the end of files.
      - id: check-added-large-files
        args: ["--maxkb=500"]

  - repo: https://github.com/pycqa/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        args: ["--max-line-length=120"]
        additional_dependencies:
          - flake8-bugbear
          - flake8-comprehensions
          - flake8-docstrings

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        args:
          - "--strict"
          - "app"
        always_run: true
        pass_filenames: false
        files: ^(app|tests)/.*\.py$
        additional_dependencies:
          - types-requests
          - types-boto3
          - types-botocore
          - types-PyYAML
          # pymongo has no official stubs, so we’ll ignore missing imports instead
          - mypy-extensions

  - repo: local
    hooks:
      - id: commitlint
        name: commitlint
        entry: npx --no-install commitlint --edit .git/COMMIT_EDITMSG
        language: node
        stages: [commit-msg]
        pass_filenames: false

  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        args: ["--line-length=88"]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
        description: Validate YAML files.

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        args: ["--write"]
        files: \.(json|md|yml|yaml)$

  - repo: https://github.com/pycqa/pylint
    rev: v3.3.9
    hooks:
      - id: pylint
        args:
          - "--output-format=colorized"
          - "--rcfile=.pylintrc"
          - "--disable=raw-checker-failed,bad-inline-option,locally-disabled,file-ignored,suppressed-message,useless-suppression,deprecated-pragma,use-symbolic-message-instead,E1101"
        files: \.py$
        exclude: ^\.cache
        fail_fast: false
        additional_dependencies:
          - astroid>=3.3.3
          - setuptools<81
