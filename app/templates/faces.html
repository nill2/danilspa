{% extends "base.html" %}

{% block head %}
    {{ super() }}
    <link rel="stylesheet" href="{{ url_for('static', filename='extended_beauty.css') }}">
{% endblock %}

{% block content %}
<div class="center">
    <h1>Faces</h1>

    <img id="face-image" src="" width="640" height="480" alt="Face">

    <div id="image-info">
        <p>Filename: <span id="filename"></span></p>
        <p>Upload Date: <span id="bsonTime"></span></p>
    </div>

    <div class="navigation-buttons">
        <button id="prev" class="btn btn-secondary">Previous</button>
        <button id="next" class="btn btn-secondary">Next</button>
    </div>
</div>

<script>
let faces = [];
let index = 0;

async function loadFaces() {
    try {
        const res = await fetch("https://nill2.duckdns.org/photos_detected_faces");
        if (!res.ok) throw new Error("Failed to load faces metadata");

        const data = await res.json();
        faces = data.results || [];

        if (faces.length === 0) {
            console.error("No faces detected");
            return;
        }

        display(index);
    } catch (err) {
        console.error(err);
    }
}

function display(i) {
    const item = faces[i];
    if (!item) return;

    const filename = item.filename;
    document.getElementById("filename").textContent = filename;
    document.getElementById("bsonTime").textContent = item.bsonTime;

    // Load image from backend
    document.getElementById("face-image").src =
        "https://nill2.duckdns.org/face_image/" + encodeURIComponent(filename);
}

document.getElementById("prev").onclick = () => {
    if (index > 0) index--;
    display(index);
};

document.getElementById("next").onclick = () => {
    if (index < faces.length - 1) index++;
    display(index);
};

loadFaces();
</script>

{% endblock %}
